---
title: Multivariate Inference, Similarity and Ordination (MISO)
name: miso
version: 1.0.0
jms: '1.0'
authors:
  - Januar Harianto
maintainer: Januar Harianto <januar.harianto@sydney.edu.au>
date: '2026-06-30'
type: R
description: >-
  Provides PERMANOVA, PERMDISP, ANOSIM, SIMPER, nMDS, PCoA, and cluster analysis
  workflows for multivariate abundance and community-style data using vegan and
  ggplot2.
datasets:
  - name: dune_meadows
    path: dune_meadows.csv
    description: >-
      Cover of 30 plant species at 20 dune meadow sites in the Netherlands, with
      management and environment variables (soil A1 horizon thickness, moisture,
      management regime, land use, manuring). Classic community ecology data
      from Batterink and Wijffels (1983), distributed with the vegan R package.
    tags:
      - PERMANOVA
      - nMDS
      - vegan
analyses:
  - title: PERMANOVA
    name: permanova
    ns: miso
    category: analyses
    menuGroup: miso
    menuTitle: PERMANOVA
    menuSubtitle: Test group differences
    description: >-
      Tests whether multivariate composition is associated with one or more
      predictors using PERMANOVA through vegan::adonis2. Supports restricted
      permutations, pairwise comparisons, and a descriptive companion PCoA.
  - title: ANOSIM
    name: anosim
    ns: miso
    category: analyses
    menuGroup: miso
    menuTitle: ANOSIM
    menuSubtitle: Rank-based alternative
    description: >-
      Tests whether within-group samples are more similar than between-group
      samples using rank-based ANOSIM through vegan::anosim. Includes optional
      pairwise comparisons and rank diagnostics.
  - title: PERMDISP
    name: permdisp
    ns: miso
    category: analyses
    menuGroup: miso
    menuTitle: PERMDISP
    menuSubtitle: Check group dispersion
    description: >-
      Tests whether groups differ in multivariate dispersion using
      vegan::betadisper and permutation tests. Includes distance-to-centre
      summaries, diagnostics, and an optional ordination.
  - title: nMDS
    name: nmds
    ns: miso
    category: analyses
    menuGroup: miso
    menuTitle: nMDS
    menuSubtitle: Visualise sample patterns
    description: >-
      Produces a non-metric multidimensional scaling ordination through
      vegan::metaMDS. Reports stress and convergence and can add group, feature,
      environmental, and Shepard diagnostics.
  - title: PCoA
    name: pcoa
    ns: miso
    category: analyses
    menuGroup: miso
    menuTitle: PCoA
    menuSubtitle: Visualise distance structure
    description: >-
      Performs descriptive principal coordinates analysis (PCoA) of pairwise
      dissimilarities among sites. The ordination visualises resemblance
      structure and does not test group differences. When called from R, it
      returns the jamovi analysis results object.
  - title: Cluster analysis
    name: cluster
    ns: miso
    category: analyses
    menuGroup: miso
    menuTitle: Cluster analysis
    menuSubtitle: Visualise sample similarity
    description: >-
      Groups samples by hierarchical clustering of dissimilarities calculated
      with vegan::vegdist and stats::hclust. The dendrogram and optional cluster
      memberships are descriptive.
  - title: SIMPER
    name: simper
    ns: miso
    category: analyses
    menuGroup: miso
    menuTitle: SIMPER
    menuSubtitle: Feature contributions
    description: >-
      Describes how individual features contribute to average Bray-Curtis
      dissimilarity between groups using vegan::simper. Optional permutation
      results are exploratory rather than an overall group test.
usesNative: true
minApp: 1.0.8

...
