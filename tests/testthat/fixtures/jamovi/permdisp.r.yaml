---
name: permdisp
title: PERMDISP
jrs: '1.1'

items:
  - name: guidance
    title: Getting started
    type: Html
    visible: false

  - name: summary
    title: Data Summary
    type: Table
    visible: false
    rows: 0
    columns:
      - name: item
        title: Item
        type: text
      - name: value
        title: Value
        type: text

  - name: warnings
    title: Data handling warnings
    type: Html
    visible: false

  - name: distances
    title: Distances to Group Centre
    type: Table
    visible: false
    rows: 0
    columns:
      - name: group
        title: Group
        type: text
      - name: 'n'
        title: n
        type: integer
      - name: distance
        title: Mean distance
        type: number
      - name: median
        title: Median distance
        type: number
      - name: sd
        title: Standard deviation
        type: number
      - name: min
        title: Minimum
        type: number
      - name: max
        title: Maximum
        type: number

  - name: anova
    title: Dispersion Test
    type: Table
    visible: false
    rows: 0
    columns:
      - name: source
        title: Source
        type: text
      - name: df
        title: df
        type: integer
      - name: sumsqs
        title: Sum Sq
        type: number
      - name: meansq
        title: Mean Sq
        type: number
      - name: f
        title: F
        type: number
      - name: p
        title: Permutation p
        type: number
        format: zto,pvalue

  - name: pairwise
    title: Pairwise Dispersion Comparisons
    type: Table
    visible: false
    rows: 0
    columns:
      - name: contrast
        title: Contrast
        type: text
      - name: statistic
        title: t
        type: number
      - name: p
        title: Permutation p
        type: number
        format: zto,pvalue
      - name: padj
        title: Adjusted p
        type: number
        format: zto,pvalue

  - name: plot
    title: Distance Distributions
    type: Image
    visible: false
    width: 600
    height: 450
    renderFun: .plotDistances

  - name: note
    title: Interpretation
    type: Html
    visible: false

  - name: settings
    title: Analysis settings
    type: Table
    visible: false
    rows: 0
    columns:
      - name: setting
        title: Setting
        type: text
      - name: value
        title: Value
        type: text

...
