title: PERMANOVA
name: permanova
jus: '3.0'
stage: 0
compilerMode: tame
events:
  updated: view_updated
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Feature Variables
        children:
          - type: VariablesListBox
            name: vars
            isTarget: true
      - type: TargetLayoutBox
        label: Grouping Variable
        children:
          - type: VariablesListBox
            name: factor
            maxItemCount: 1
            isTarget: true
            events:
              change: update_control_states
      - type: TargetLayoutBox
        label: Additional Factors
        children:
          - type: VariablesListBox
            name: permFactors
            isTarget: true
            events:
              change: update_control_states
          - type: CheckBox
            name: permInteractions
            events:
              change: update_control_states
      - type: TargetLayoutBox
        label: Blocking Variable
        children:
          - type: VariablesListBox
            name: strata
            maxItemCount: 1
            isTarget: true
            events:
              change: update_control_states
      - type: TargetLayoutBox
        label: Continuous Covariates
        children:
          - type: VariablesListBox
            name: covariates
            isTarget: true
            events:
              change: update_control_states
  - type: CollapseBox
    name: analysisChoices
    label: Analysis Choices
    collapsed: false
    stretchFactor: 1
    children:
      - type: ComboBox
        name: permScheme
        events:
          change: update_control_states
      - type: ComboBox
        name: permBy
        events:
          change: update_control_states
      - type: ComboBox
        name: transform
        events:
          change: update_control_states
      - type: ComboBox
        name: distance
        events:
          change: update_control_states
      - type: CheckBox
        name: distBinary
        events:
          change: update_control_states
      - type: CheckBox
        name: distSqrt
        events:
          change: update_control_states
      - type: ComboBox
        name: distAdd
        events:
          change: update_control_states
      - type: CheckBox
        name: permPairwise
        style: list
        events:
          change: update_control_states
        children:
          - type: ComboBox
            name: permAdjust
            enable: (permPairwise)
  - type: CollapseBox
    name: plots
    label: Plots
    collapsed: false
    stretchFactor: 1
    children:
      - type: CheckBox
        name: showCompanionPcoa
        events:
          change: update_control_states
      - type: VariableSupplier
        name: pcoaDisplayVariables
        label: Display Groups By
        persistentItems: false
        stretchFactor: 1
        children:
          - type: TargetLayoutBox
            label: Model Factor
            children:
              - type: VariablesListBox
                name: pcoaDisplayFactor
                maxItemCount: 1
                isTarget: true
                events:
                  change: update_control_states
      - type: Label
        label: Choose the same primary or additional factor retained in the fitted model.
        margin: none
      - type: CheckBox
        name: pcoaCentroids
      - type: CheckBox
        name: pcoaSpiders
  - type: CollapseBox
    name: reproducibility
    label: Reproducibility and Technical Settings
    collapsed: true
    stretchFactor: 1
    children:
      - type: TextBox
        name: permN
        format: number
      - type: CheckBox
        name: useFixedSeed
        events:
          change: fixed_seed_changed
      - type: TextBox
        name: seed
        format: number
        enable: (useFixedSeed)
        events:
          change: seed_changed
      - type: CheckBox
        name: useParallel
