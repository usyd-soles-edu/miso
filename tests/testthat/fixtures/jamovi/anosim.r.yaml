---
name: anosim
title: ANOSIM
jrs: '1.1'
refs:
  - vegan
  - clarke1993

items:
  - name: guidance
    title: Getting Started
    type: Html
    visible: false

  - name: warnings
    title: ''
    type: Html
    visible: false

  - name: global
    title: Global ANOSIM
    type: Table
    visible: false
    rows: 1
    columns:
      - name: statistic
        title: Statistic
        type: text
      - name: value
        title: R
        type: number
      - name: p
        title: Permutation p
        type: number
        format: zto,pvalue
      - name: permutations
        title: Effective permutations
        type: integer

  - name: pairwise
    title: Pairwise ANOSIM
    type: Table
    visible: false
    rows: 0
    columns:
      - name: contrast
        title: Contrast
        type: text
      - name: r
        title: R
        type: number
      - name: p
        title: Permutation p
        type: number
        format: zto,pvalue

      - name: padj
        title: Adjusted p
        type: number
        format: zto,pvalue

  - name: rankPlotDescription
    title: Ranked dissimilarities by pair category
    type: Html
    visible: false
    clearWith:
      - vars
      - factor
      - transform
      - distance
      - strata
      - permRestriction
      - permScheme
      - anosimN
      - seed

  - name: rankPlot
    title: Ranked Dissimilarities Plot
    type: Image
    visible: false
    clearWith:
      - vars
      - factor
      - transform
      - distance
      - strata
      - permRestriction
      - permScheme
      - anosimN
      - seed
    width: 600
    height: 480
    renderFun: .plotRank

  - name: rankSummary
    title: Ranked Dissimilarities
    type: Table
    visible: false
    rows: 0
    columns:
      - name: category
        title: Pair category
        type: text
      - name: pairs
        title: Pairs
        type: integer
      - name: median
        title: Median rank
        type: number
      - name: q1
        title: Q1 rank
        type: number
      - name: q3
        title: Q3 rank
        type: number
