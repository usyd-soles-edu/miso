---
title: ANOSIM
name: anosim
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Feature Variables
        children:
          - type: VariablesListBox
            name: vars
            isTarget: true
      - type: TargetLayoutBox
        label: Grouping Variable
        children:
          - type: VariablesListBox
            name: factor
            maxItemCount: 1
            isTarget: true
  - type: CollapseBox
    name: analysisChoices
    label: Analysis Choices
    collapsed: false
    stretchFactor: 1
    children:
      - type: ComboBox
        name: transform
      - type: ComboBox
        name: distance
      - type: CheckBox
        name: distBinary
      - type: CheckBox
        name: anosimPairwise
        events:
          change: update_control_states
      - type: ComboBox
        name: anosimAdjust
  - type: CollapseBox
    name: plots
    label: Plots
    collapsed: false
    stretchFactor: 1
    children:
      - type: CheckBox
        name: showRankPlot
  - type: CollapseBox
    name: studyDesign
    label: Study Design and Permutation Restrictions
    collapsed: true
    stretchFactor: 1
    children:
      - type: VariableSupplier
        persistentItems: false
        stretchFactor: 1
        children:
          - type: TargetLayoutBox
            label: Blocking Variable
            children:
              - type: VariablesListBox
                name: strata
                maxItemCount: 1
                isTarget: true
      - type: ComboBox
        name: permRestriction
  - type: CollapseBox
    name: reproducibility
    label: Reproducibility and Computation
    collapsed: true
    stretchFactor: 1
    children:
      - type: TextBox
        name: anosimN
        format: number
      - type: TextBox
        name: seed
        format: number
      - type: CheckBox
        name: useParallel

...
