---
name: nmds
title: nMDS
jrs: '1.1'
refs:
  - vegan

items:
  - name: guidance
    title: Getting Started
    type: Html
    visible: false
    clearWith: &clearWith
      - vars
      - factor
      - transform
      - distance
      - distBinary
      - seed
      - nmdsK
      - nmdsTrymax
      - nmdsMaxit
      - nmdsEnv
      - nmdsEnvPerm

  - name: warnings
    title: ''
    type: Html
    visible: false
    clearWith:
      - vars
      - factor
      - transform
      - distance
      - distBinary
      - seed
      - nmdsK
      - nmdsTrymax
      - nmdsMaxit
      - nmdsEnv
      - nmdsEnvPerm

  - name: ordinationDescription
    title: Two-dimensional nMDS ordination
    type: Html
    visible: false
    clearWith:
      - vars
      - factor
      - transform
      - distance
      - distBinary
      - seed
      - nmdsK
      - nmdsTrymax
      - nmdsMaxit
      - nmdsEnv
      - nmdsEnvPerm

  - name: ordination
    title: nMDS Ordination
    type: Image
    width: 580
    height: 450
    renderFun: .plotNmds
    visible: false
    clearWith:
      - vars
      - factor
      - transform
      - distance
      - distBinary
      - seed
      - nmdsK
      - nmdsTrymax
      - nmdsMaxit
      - nmdsEnv
      - nmdsEnvPerm

  - name: sites
    title: Site Scores
    type: Table
    rows: 0
    visible: false
    columns:
      - name: row
        title: Row
        type: integer
      - name: NMDS1
        title: NMDS1
        type: number
        format: zto
      - name: NMDS2
        title: NMDS2
        type: number
        format: zto
      - name: NMDS3
        title: NMDS3
        type: number
        format: zto
      - name: group
        title: Group
        type: text
    clearWith:
      - vars
      - factor
      - transform
      - distance
      - distBinary
      - seed
      - nmdsK
      - nmdsTrymax
      - nmdsMaxit
      - nmdsEnv
      - nmdsEnvPerm

  - name: stress
    title: Stress and Convergence Diagnostics
    type: Table
    rows: 8
    visible: false
    columns:
      - name: item
        title: Item
        type: text
      - name: value
        title: Value
        type: text
    clearWith:
      - vars
      - factor
      - transform
      - distance
      - distBinary
      - seed
      - nmdsK
      - nmdsTrymax
      - nmdsMaxit
      - nmdsEnv
      - nmdsEnvPerm

  - name: shepardDescription
    title: Shepard Diagram
    type: Html
    visible: false
    clearWith:
      - vars
      - factor
      - transform
      - distance
      - distBinary
      - seed
      - nmdsK
      - nmdsTrymax
      - nmdsMaxit
      - nmdsEnv
      - nmdsEnvPerm

  - name: shepard
    title: Shepard Diagram
    type: Image
    width: 580
    height: 450
    renderFun: .plotShepard
    visible: false
    clearWith:
      - vars
      - factor
      - transform
      - distance
      - distBinary
      - seed
      - nmdsK
      - nmdsTrymax
      - nmdsMaxit
      - nmdsEnv
      - nmdsEnvPerm

  - name: shepardPairs
    title: Shepard Diagram Values
    type: Table
    rows: 0
    visible: false
    columns:
      - name: dissimilarity
        title: Observed dissimilarity
        type: number
        format: zto
      - name: ordinationDistance
        title: Ordination distance
        type: number
        format: zto
      - name: monotonicFit
        title: Monotone fitted distance
        type: number
        format: zto
    clearWith:
      - vars
      - factor
      - transform
      - distance
      - distBinary
      - seed
      - nmdsK
      - nmdsTrymax
      - nmdsMaxit
      - nmdsEnv
      - nmdsEnvPerm

  - name: envfit
    title: Environmental Fit
    type: Table
    rows: 0
    visible: false
    columns:
      - name: variable
        title: Variable
        type: text
      - name: r2
        title: r²
        type: number
        format: zto
      - name: p
        title: p (unadjusted)
        type: number
        format: zto,pvalue
      - name: samples
        title: n
        type: integer
      - name: permutations
        title: Permutations
        type: integer
      - name: NMDS1
        title: NMDS1
        type: number
        format: zto
      - name: NMDS2
        title: NMDS2
        type: number
        format: zto
      - name: NMDS3
        title: NMDS3
        type: number
        format: zto
    clearWith:
      - vars
      - factor
      - transform
      - distance
      - distBinary
      - seed
      - nmdsK
      - nmdsTrymax
      - nmdsMaxit
      - nmdsEnv
      - nmdsEnvPerm

  - name: features
    title: Feature Scores
    type: Table
    rows: 0
    visible: false
    columns:
      - name: feature
        title: Feature
        type: text
      - name: NMDS1
        title: NMDS1
        type: number
        format: zto
      - name: NMDS2
        title: NMDS2
        type: number
        format: zto
      - name: NMDS3
        title: NMDS3
        type: number
        format: zto
    clearWith:
      - vars
      - factor
      - transform
      - distance
      - distBinary
      - seed
      - nmdsK
      - nmdsTrymax
      - nmdsMaxit
      - nmdsEnv
      - nmdsEnvPerm

