---
name: simper
title: SIMPER
menuGroup: Multivariate
menuTitle: SIMPER
menuSubtitle: Feature contributions
version: '1.0.0'
jas: '1.2'
description:
  main: Describes how individual features contribute to average Bray-Curtis dissimilarity between groups using vegan::simper. Optional permutation results are exploratory rather than an overall group test.
  references:
    - >-
      Oksanen et al. (2026). vegan: Community Ecology Package (R package
      version 2.7-5). https://vegandevs.github.io/vegan/
    - >-
      Clarke, K. R. (1993). Non-parametric multivariate analyses of changes
      in community structure. Australian Journal of Ecology, 18(1), 117-143.
      https://doi.org/10.1111/j.1442-9993.1993.tb00438.x

options:
  - name: data
    type: Data

  - name: vars
    title: Feature Variables
    type: Variables
    suggested:
      - continuous
      - nominal
      - ordinal
    permitted:
      - numeric
      - factor

  - name: factor
    title: Grouping Variable
    type: Variable
    suggested:
      - nominal
      - ordinal
    permitted:
      - factor

  - name: transform
    title: Transformation
    type: List
    options:
      - title: None
        name: none
      - title: Square root
        name: sqrt
      - title: Fourth root
        name: fourthroot
      - title: Log(x + 1)
        name: log
      - title: Presence/absence
        name: pa
      - title: Wisconsin
        name: wisconsin
      - title: Hellinger
        name: hellinger
      - title: Total
        name: total
      - title: Max
        name: max
      - title: Frequency
        name: frequency
      - title: Normalize
        name: normalize
      - title: Range
        name: range
      - title: Standardize
        name: standardize
      - title: Chi-square
        name: chi.square
      - title: Reverse CLR
        name: rclr
    default: none

  - name: distance
    title: Dissimilarity index
    type: List
    options:
      - title: Bray-Curtis
        name: bray
      - title: Jaccard
        name: jaccard
      - title: Euclidean
        name: euclidean
      - title: Manhattan
        name: manhattan
      - title: Canberra
        name: canberra
      - title: Kulczynski
        name: kulczynski
      - title: Gower
        name: gower
      - title: Morisita
        name: morisita
      - title: Horn-Morisita
        name: horn
      - title: Mountford
        name: mountford
      - title: Raup-Crick
        name: raup
      - title: Binomial
        name: binomial
      - title: Chao
        name: chao
      - title: Cao
        name: cao
      - title: Clark
        name: clark
      - title: Alternative Gower
        name: altGower
      - title: Mahalanobis
        name: mahalanobis
    default: bray
    hidden: true

  - name: distBinary
    title: Binary (presence/absence)
    type: Bool
    default: false
    hidden: true

  - name: seed
    title: Random seed (0 = random)
    type: Number
    default: 0
    min: 0

  - name: simperN
    title: Permutations
    type: Number
    default: 999
    min: 1

  - name: simperTop
    title: Top N features
    type: Number
    default: 10
    min: 1

  - name: simperCum
    title: Cumulative contribution (%)
    type: Number
    default: 70
    min: 1
    max: 100

  - name: simperPlots
    title: Contribution plots
    type: Bool
    default: false

  - name: simperHeatmap
    title: Contrast overview heatmap
    type: Bool
    default: false

  - name: simperAssess
    title: Permutation contribution assessment
    type: Bool
    default: false

  - name: simperAdjust
    title: P-value adjustment
    type: List
    options:
      - title: Holm
        name: holm
      - title: Bonferroni
        name: bonferroni
      - title: Benjamini-Hochberg
        name: BH
      - title: Benjamini-Yekutieli
        name: BY
      - title: None
        name: none
    default: holm

  - name: simperDetails
    title: Detailed Statistics
    type: Bool
    default: false

...
