title: PERMANOVA
name: permanova
jus: '3.0'
stage: 0
compilerMode: tame
events:
  loaded: view_loaded
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: "Required: Feature variables"
        children:
          - type: VariablesListBox
            name: vars
            isTarget: true
      - type: TargetLayoutBox
        label: "Required: Grouping variable"
        children:
          - type: VariablesListBox
            name: factor
            maxItemCount: 1
            isTarget: true
  - type: CollapseBox
    name: studyDesign
    label: Study design and model
    collapsed: true
    stretchFactor: 1
    children:
      - type: VariableSupplier
        name: studyVariables
        label: Optional model variables
        persistentItems: false
        stretchFactor: 1
        children:
          - type: TargetLayoutBox
            label: Additional factors
            children:
              - type: VariablesListBox
                name: permFactors
                isTarget: true
                events:
                  change: update_control_states
          - type: TargetLayoutBox
            label: Blocking variable
            children:
              - type: VariablesListBox
                name: strata
                maxItemCount: 1
                isTarget: true
          - type: TargetLayoutBox
            label: Continuous covariates
            children:
              - type: VariablesListBox
                name: covariates
                isTarget: true
      - type: CheckBox
        name: permInteractions
        events:
          change: update_control_states
      - type: ComboBox
        name: permScheme
      - type: ComboBox
        name: permBy
        events:
          change: update_control_states
  - type: CollapseBox
    name: analysisChoices
    label: Analysis choices
    collapsed: false
    stretchFactor: 1
    children:
      - type: ComboBox
        name: transform
      - type: ComboBox
        name: distance
      - type: CheckBox
        name: distBinary
      - type: CheckBox
        name: distSqrt
      - type: ComboBox
        name: distAdd
      - type: CheckBox
        name: permPairwise
        events:
          change: update_control_states
      - type: ComboBox
        name: permAdjust
  - type: CollapseBox
    name: reproducibility
    label: Reproducibility and technical settings
    collapsed: true
    stretchFactor: 1
    children:
      - type: TextBox
        name: permN
        format: number
      - type: TextBox
        name: seed
        format: number
      - type: CheckBox
        name: useParallel
