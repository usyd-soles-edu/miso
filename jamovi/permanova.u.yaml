title: PERMANOVA
name: permanova
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Feature variables
        children:
          - type: VariablesListBox
            name: vars
            isTarget: true
      - type: TargetLayoutBox
        label: Grouping variable
        children:
          - type: VariablesListBox
            name: factor
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Additional factors
        children:
          - type: VariablesListBox
            name: permFactors
            isTarget: true
      - type: TargetLayoutBox
        label: Strata / blocking factor
        children:
          - type: VariablesListBox
            name: strata
            maxItemCount: 1
            isTarget: true
  - type: CollapseBox
    label: Resemblance
    collapsed: false
    stretchFactor: 1
    children:
      - type: ComboBox
        name: transform
      - type: ComboBox
        name: distance
      - type: CheckBox
        name: distBinary
      - type: CheckBox
        name: distSqrt
      - type: ComboBox
        name: distAdd
      - type: TextBox
        name: seed
        format: number
  - type: CollapseBox
    label: PERMANOVA
    collapsed: false
    stretchFactor: 1
    children:
      - type: TextBox
        name: permN
        format: number
      - type: ComboBox
        name: permBy
      - type: CheckBox
        name: permInteractions
      - type: CheckBox
        name: permPairwise
      - type: ComboBox
        name: permAdjust
