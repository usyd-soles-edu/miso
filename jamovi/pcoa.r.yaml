---
name: pcoa
title: PCoA
jrs: '1.1'
refs:
  - vegan

items:
  - name: guidance
    title: Getting Started
    type: Html
    visible: false
    clearWith: &clearWith
      - vars
      - factor
      - transform
      - distance
      - distBinary
      - sqrtDist
      - correction

  - name: warnings
    title: ''
    type: Html
    visible: false
    clearWith: *clearWith

  - name: ordinationDescription
    title: Principal coordinates ordination
    type: Html
    visible: false
    clearWith: *clearWith

  - name: ordination
    title: PCoA Ordination
    type: Image
    width: 600
    height: 500
    renderFun: .plotPcoa
    visible: false
    clearWith: *clearWith

  - name: sites
    title: Site Coordinates
    type: Table
    rows: 0
    visible: false
    columns:
      - name: site
        title: Site
        type: text
      - name: sourceRow
        title: Source row
        type: integer
      - name: group
        title: Group
        type: text
      - name: PCoA1
        title: PCoA1
        type: number
        format: zto
      - name: PCoA2
        title: PCoA2
        type: number
        format: zto
    clearWith:
      - vars
      - factor
      - transform
      - distance
      - distBinary
      - sqrtDist
      - correction

  - name: centroids
    title: Group Centroids
    type: Table
    rows: 0
    visible: false
    columns:
      - name: group
        title: Group
        type: text
      - name: n
        title: n
        type: integer
      - name: PCoA1
        title: PCoA1
        type: number
        format: zto
      - name: PCoA2
        title: PCoA2
        type: number
        format: zto
    clearWith: *clearWith

  - name: eigenvalues
    title: Eigenvalues
    type: Table
    rows: 0
    visible: false
    columns:
      - name: axis
        title: Axis
        type: text
      - name: eigenvalue
        title: Eigenvalue
        type: number
        format: zto
      - name: sign
        title: Sign
        type: text
      - name: explained
        title: Explained (%)
        type: number
        format: zto
    clearWith:
      - vars
      - factor
      - transform
      - distance
      - distBinary
      - sqrtDist
      - correction

