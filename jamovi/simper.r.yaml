---
name: simper
title: SIMPER
jrs: '1.1'

items:
  - name: guidance
    title: Getting started
    type: Html
    visible: false

  - name: summary
    title: Data Summary
    type: Table
    visible: false
    rows: 0
    columns:
      - name: item
        title: Item
        type: text
      - name: value
        title: Value
        type: text

  - name: warnings
    title: Data handling warnings
    type: Html
    visible: false

  - name: contrasts
    title: Contrast summary
    type: Table
    visible: false
    rows: 0
    columns:
      - name: contrast
        title: Contrast
        type: text
      - name: nFirst
        title: n (first)
        type: integer
      - name: nSecond
        title: n (second)
        type: integer
      - name: overall
        title: Mean dissimilarity
        type: number

  - name: contributions
    title: Descriptive feature contributions
    type: Table
    visible: false
    rows: 0
    columns:
      - name: contrast
        title: Contrast
        type: text
      - name: feature
        title: Feature
        type: text
      - name: contribution
        title: Contribution (%)
        type: number
      - name: cumulative
        title: Cumulative (%)
        type: number

  - name: variability
    title: Contribution variability
    type: Table
    visible: false
    rows: 0
    columns:
      - name: contrast
        title: Contrast
        type: text
      - name: feature
        title: Feature
        type: text
      - name: average
        title: Average
        type: number
      - name: sd
        title: SD
        type: number
      - name: ratio
        title: Average/SD
        type: number

  - name: means
    title: Group means
    type: Table
    visible: false
    rows: 0
    columns:
      - name: contrast
        title: Contrast
        type: text
      - name: feature
        title: Feature
        type: text
      - name: meanFirst
        title: First mean
        type: number
      - name: meanSecond
        title: Second mean
        type: number

  - name: table
    title: Descriptive feature contributions
    type: Table
    visible: false
    rows: 0
    columns:
      - name: contrast
        title: Contrast
        type: text
      - name: feature
        title: Feature
        type: text
      - name: average
        title: Average contribution
        type: number
      - name: sd
        title: Contribution SD
        type: number
      - name: ratio
        title: Average divided by SD
        type: number
      - name: meanFirst
        title: Mean in first group
        type: number
      - name: meanSecond
        title: Mean in second group
        type: number
      - name: contribution
        title: Contribution (%)
        type: number
      - name: cumulative
        title: Cumulative contribution (%)
        type: number

  - name: plot
    title: SIMPER contribution percentages by group contrast
    type: Image
    visible: false
    width: 580
    height: 450
    renderFun: .plotContributions

  - name: plotDescription
    title: Plot details
    type: Html
    visible: false

  - name: assessment
    title: Exploratory permutation assessment
    type: Table
    visible: false
    rows: 0
    columns:
      - name: contrast
        title: Contrast
        type: text
      - name: feature
        title: Feature
        type: text
      - name: p
        title: Permutation p
        type: number
        format: zto,pvalue
      - name: padj
        title: Adjusted p
        type: number
        format: zto,pvalue

  - name: note
    title: Interpretation
    type: Html
    visible: false

  - name: settings
    title: Analysis settings
    type: Table
    visible: false
    rows: 0
    columns:
      - name: setting
        title: Setting
        type: text
      - name: value
        title: Value
        type: text

...
