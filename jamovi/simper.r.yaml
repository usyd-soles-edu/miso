---
name: simper
title: SIMPER
jrs: '1.1'
refs:
  - vegan
  - clarke1993

items:
  - name: seedState
    title: ''
    type: Html
    visible: false
    clearWith: []

  - name: guidance
    title: Getting Started
    type: Html
    visible: false

  - name: warnings
    title: ''
    type: Html
    visible: false

  - name: contrasts
    title: Contrast Summary
    type: Table
    visible: false
    rows: 0
    columns:
      - name: contrast
        title: Contrast
        type: text
      - name: nFirst
        title: n (first)
        type: integer
      - name: nSecond
        title: n (second)
        type: integer
      - name: overall
        title: Mean dissimilarity
        type: number

  - name: contributions
    title: Descriptive Feature Contributions
    type: Table
    visible: false
    rows: 0
    columns:
      - name: contrast
        title: Contrast
        type: text
      - name: feature
        title: Feature
        type: text
      - name: contribution
        title: Contribution (%)
        type: number
      - name: cumulative
        title: Cumulative (%)
        type: number

  - name: detailsByContrast
    title: Group Means and Contribution Variability
    type: Array
    clearWith: []
    visible: false
    template:
      type: Table
      title: Contrast details
      clearWith: []
      rows: 0
      columns:
        - name: feature
          title: Feature
          type: text
        - name: meanFirst
          title: First group mean
          type: number
        - name: meanSecond
          title: Second group mean
          type: number
        - name: average
          title: Average contribution
          type: number
        - name: sd
          title: SD
          type: number
        - name: ratio
          title: Average/SD
          type: number

  - name: contributionPlots
    title: Contribution Plots by Contrast
    type: Array
    clearWith: []
    visible: false
    template:
      type: Group
      title: Contrast contribution
      clearWith: []
      items:
        - name: description
          title: Contribution Plot
          type: Html
        - name: plot
          title: Contribution Plot
          type: Image
          clearWith: []
          width: 580
          height: 430
          renderFun: .plotContribution

  - name: heatmapDescription
    title: Contrast Overview Heatmap
    type: Html
    visible: false
    clearWith:

  - name: heatmap
    title: Contrast Overview Heatmap
    type: Image
    visible: false
    clearWith:
    width: 600
    height: 500
    renderFun: .plotHeatmap

  - name: assessment
    title: Permutation Assessment
    type: Table
    visible: false
    rows: 0
    columns:
      - name: contrast
        title: Contrast
        type: text
      - name: feature
        title: Feature
        type: text
      - name: p
        title: Permutation p
        type: number
        format: zto,pvalue
      - name: padj
        title: Adjusted p
        type: number
        format: zto,pvalue
