---
name: simper
title: SIMPER
jrs: '1.1'
refs:
  - vegan
  - clarke1993

items:
  - name: guidance
    title: Getting Started
    type: Html
    visible: false

  - name: warnings
    title: ''
    type: Html
    visible: false

  - name: contrasts
    title: Contrast Summary
    type: Table
    visible: false
    rows: 0
    columns:
      - name: contrast
        title: Contrast
        type: text
      - name: nFirst
        title: n (first)
        type: integer
      - name: nSecond
        title: n (second)
        type: integer
      - name: overall
        title: Mean dissimilarity
        type: number

  - name: contributions
    title: Descriptive Feature Contributions
    type: Table
    visible: false
    rows: 0
    columns:
      - name: contrast
        title: Contrast
        type: text
      - name: feature
        title: Feature
        type: text
      - name: contribution
        title: Contribution (%)
        type: number
      - name: cumulative
        title: Cumulative (%)
        type: number

  - name: variability
    title: Contribution Variability
    type: Table
    visible: false
    clearWith:
    rows: 0
    columns:
      - name: contrast
        title: Contrast
        type: text
      - name: feature
        title: Feature
        type: text
      - name: average
        title: Average
        type: number
      - name: sd
        title: SD
        type: number
      - name: ratio
        title: Average/SD
        type: number

  - name: means
    title: Group Means
    type: Table
    visible: false
    clearWith:
    rows: 0
    columns:
      - name: contrast
        title: Contrast
        type: text
      - name: feature
        title: Feature
        type: text
      - name: meanFirst
        title: First mean
        type: number
      - name: meanSecond
        title: Second mean
        type: number

  - name: table
    title: Descriptive Feature Contributions
    type: Table
    visible: false
    rows: 0
    columns:
      - name: contrast
        title: Contrast
        type: text
      - name: feature
        title: Feature
        type: text
      - name: average
        title: Average contribution
        type: number
      - name: sd
        title: Contribution SD
        type: number
      - name: ratio
        title: Average divided by SD
        type: number
      - name: meanFirst
        title: Mean in first group
        type: number
      - name: meanSecond
        title: Mean in second group
        type: number
      - name: contribution
        title: Contribution (%)
        type: number
      - name: cumulative
        title: Cumulative contribution (%)
        type: number

  - name: contributionPlots
    title: Contribution Plots by Contrast
    type: Array
    visible: false
    template:
      type: Group
      title: Contrast contribution
      items:
        - name: description
          title: Contribution Plot
          type: Html
        - name: plot
          title: Contribution Plot
          type: Image
          width: 580
          height: 430
          renderFun: .plotContribution
        - name: values
          title: Contribution Values
          type: Table
          rows: 0
          columns:
            - name: feature
              title: Feature
              type: text
            - name: average
              title: Average contribution
              type: number
            - name: contribution
              title: Contribution (%)
              type: number
            - name: cumulative
              title: Cumulative (%)
              type: number
            - name: firstGroup
              title: First group
              type: text
            - name: meanFirst
              title: First mean
              type: number
            - name: secondGroup
              title: Second group
              type: text
            - name: meanSecond
              title: Second mean
              type: number
            - name: direction
              title: Direction
              type: text
  - name: heatmapDescription
    title: Contrast Overview Heatmap
    type: Html
    visible: false
    clearWith:

  - name: heatmap
    title: Contrast Overview Heatmap
    type: Image
    visible: false
    clearWith:
    width: 600
    height: 500
    renderFun: .plotHeatmap

  - name: heatmapValues
    title: Contrast Heatmap Values
    type: Table
    visible: false
    clearWith:
    rows: 0
    columns:
      - name: contrast
        title: Contrast
        type: text
      - name: feature
        title: Feature
        type: text
      - name: contribution
        title: Contribution (%)
        type: number
      - name: selected
        title: Selected for this contrast
        type: text

  - name: assessment
    title: Permutation Assessment
    type: Table
    visible: false
    rows: 0
    columns:
      - name: contrast
        title: Contrast
        type: text
      - name: feature
        title: Feature
        type: text
      - name: p
        title: Permutation p
        type: number
        format: zto,pvalue
      - name: padj
        title: Adjusted p
        type: number
        format: zto,pvalue

