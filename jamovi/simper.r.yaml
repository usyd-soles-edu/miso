---
name: simper
title: SIMPER
jrs: '1.1'

items:
  - name: guidance
    title: Getting started
    type: Html
    visible: false

  - name: summaryPurpose
    title: Data Summary
    type: Html
    visible: false

  - name: summary
    title: ''
    type: Table
    visible: false
    rows: 5
    columns:
      - name: item
        title: Item
        type: text
      - name: value
        title: Value
        type: text

  - name: warnings
    title: ''
    type: Html
    visible: false

  - name: contrastsPurpose
    title: Contrast summary
    type: Html
    visible: false

  - name: contrasts
    title: ''
    type: Table
    visible: false
    rows: 0
    columns:
      - name: contrast
        title: Contrast
        type: text
      - name: nFirst
        title: n (first)
        type: integer
      - name: nSecond
        title: n (second)
        type: integer
      - name: overall
        title: Mean dissimilarity
        type: number

  - name: contributionsPurpose
    title: Descriptive feature contributions
    type: Html
    visible: false

  - name: contributions
    title: ''
    type: Table
    visible: false
    rows: 0
    columns:
      - name: contrast
        title: Contrast
        type: text
      - name: feature
        title: Feature
        type: text
      - name: contribution
        title: Contribution (%)
        type: number
      - name: cumulative
        title: Cumulative (%)
        type: number

  - name: variabilityPurpose
    title: Contribution variability
    type: Html
    visible: false

  - name: variability
    title: ''
    type: Table
    visible: false
    clearWith:
      - simperDetails
    rows: 0
    columns:
      - name: contrast
        title: Contrast
        type: text
      - name: feature
        title: Feature
        type: text
      - name: average
        title: Average
        type: number
      - name: sd
        title: SD
        type: number
      - name: ratio
        title: Average/SD
        type: number

  - name: meansPurpose
    title: Group means
    type: Html
    visible: false

  - name: means
    title: ''
    type: Table
    visible: false
    clearWith:
      - simperDetails
    rows: 0
    columns:
      - name: contrast
        title: Contrast
        type: text
      - name: feature
        title: Feature
        type: text
      - name: meanFirst
        title: First mean
        type: number
      - name: meanSecond
        title: Second mean
        type: number

  - name: table
    title: Descriptive feature contributions
    type: Table
    visible: false
    rows: 0
    columns:
      - name: contrast
        title: Contrast
        type: text
      - name: feature
        title: Feature
        type: text
      - name: average
        title: Average contribution
        type: number
      - name: sd
        title: Contribution SD
        type: number
      - name: ratio
        title: Average divided by SD
        type: number
      - name: meanFirst
        title: Mean in first group
        type: number
      - name: meanSecond
        title: Mean in second group
        type: number
      - name: contribution
        title: Contribution (%)
        type: number
      - name: cumulative
        title: Cumulative contribution (%)
        type: number

  - name: contributionPlots
    title: Contribution plots by contrast
    type: Array
    visible: false
    template:
      type: Group
      title: Contrast contribution
      items:
        - name: description
          title: Contribution plot
          type: Html
        - name: plot
          title: ''
          type: Image
          width: 580
          height: 430
          renderFun: .plotContribution
        - name: valuesPurpose
          title: SIMPER contribution values
          type: Html
          visible: false

        - name: values
          title: ''
          type: Table
          rows: 0
          columns:
            - name: feature
              title: Feature
              type: text
            - name: average
              title: Average contribution
              type: number
            - name: contribution
              title: Contribution (%)
              type: number
            - name: cumulative
              title: Cumulative (%)
              type: number
            - name: firstGroup
              title: First group
              type: text
            - name: meanFirst
              title: First mean
              type: number
            - name: secondGroup
              title: Second group
              type: text
            - name: meanSecond
              title: Second mean
              type: number
            - name: direction
              title: Direction
              type: text
  - name: heatmapDescription
    title: Contrast overview heatmap
    type: Html
    visible: false
    clearWith:
      - simperHeatmap

  - name: heatmap
    title: ''
    type: Image
    visible: false
    clearWith:
      - simperHeatmap
    width: 600
    height: 500
    renderFun: .plotHeatmap

  - name: heatmapValuesPurpose
    title: SIMPER contrast heatmap values
    type: Html
    visible: false
    clearWith:
      - simperHeatmap

  - name: heatmapValues
    title: ''
    type: Table
    visible: false
    clearWith:
      - simperHeatmap
    rows: 0
    columns:
      - name: contrast
        title: Contrast
        type: text
      - name: feature
        title: Feature
        type: text
      - name: contribution
        title: Contribution (%)
        type: number
      - name: selected
        title: Selected for this contrast
        type: text

  - name: assessmentPurpose
    title: Exploratory permutation assessment
    type: Html
    visible: false

  - name: assessment
    title: ''
    type: Table
    visible: false
    rows: 0
    columns:
      - name: contrast
        title: Contrast
        type: text
      - name: feature
        title: Feature
        type: text
      - name: p
        title: Permutation p
        type: number
        format: zto,pvalue
      - name: padj
        title: Adjusted p
        type: number
        format: zto,pvalue

  - name: note
    title: How to read these results
    type: Html
    visible: false

  - name: settingsPurpose
    title: Analysis settings
    type: Html
    visible: false

  - name: settings
    title: ''
    type: Table
    visible: false
    rows: 0
    columns:
      - name: setting
        title: Setting
        type: text
      - name: value
        title: Value
        type: text

...
