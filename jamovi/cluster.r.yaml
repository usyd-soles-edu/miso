---
name: cluster
title: Cluster analysis
jrs: '1.1'
refs:
  - vegan

items:
  - name: guidance
    title: Getting Started
    type: Html
    visible: false
    clearWith: &clearWith
      - vars
      - labels
      - transform
      - distance
      - defineClusters
      - cutMode
      - numberClusters
      - cutHeight

  - name: warnings
    title: ''
    type: Html
    visible: false
    clearWith:
      - vars
      - labels
      - transform
      - distance
      - defineClusters
      - cutMode
      - numberClusters
      - cutHeight

  - name: dendrogramDescription
    title: Group-average Cluster Dendrogram
    type: Html
    visible: false
    clearWith:
      - vars
      - labels
      - transform
      - distance
      - defineClusters
      - cutMode
      - numberClusters
      - cutHeight

  - name: dendrogram
    title: Cluster Dendrogram
    type: Image
    visible: false
    width: 600
    height: 500
    renderFun: .plotDendrogram
    clearWith:
      - vars
      - labels
      - transform
      - distance
      - defineClusters
      - cutMode
      - numberClusters
      - cutHeight

  - name: dendrogramStructure
    title: Dendrogram Structure
    type: Table
    visible: false
    rows: 0
    columns:
      - name: recordType
        title: Record
        type: text
      - name: displayOrder
        title: Display order
        type: integer
      - name: sample
        title: Sample
        type: text
      - name: mergeStep
        title: Merge step
        type: integer
      - name: leftChild
        title: Left child
        type: text
      - name: rightChild
        title: Right child
        type: text
      - name: height
        title: Height
        type: number
    clearWith:
      - vars
      - labels
      - transform
      - distance
      - defineClusters
      - cutMode
      - numberClusters
      - cutHeight

  - name: membership
    title: Cluster Membership
    type: Table
    visible: false
    rows: 0
    columns:
      - name: sample
        title: Sample
        type: text
      - name: cluster
        title: Cluster
        type: integer
    clearWith:
      - vars
      - labels
      - transform
      - distance
      - defineClusters
      - cutMode
      - numberClusters
      - cutHeight

