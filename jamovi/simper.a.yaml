      - nominal
      - ordinal
    permitted:
      - factor

  - name: transform
    title: Transformation
    type: List
    options:
      - title: None
        name: none
      - title: Square root
        name: sqrt
      - title: Fourth root
        name: fourthroot
      - title: Log(x + 1)
        name: log
      - title: Presence/absence
        name: pa
      - title: Wisconsin
        name: wisconsin
      - title: Hellinger
        name: hellinger
      - title: Total
        name: total
      - title: Max
        name: max
      - title: Frequency
        name: frequency
      - title: Normalize
        name: normalize
      - title: Range
        name: range
      - title: Standardize
        name: standardize
      - title: Chi-square
        name: chi.square
      - title: Reverse CLR
        name: rclr
    default: none

  - name: distance
    title: Dissimilarity index
    type: List
    options:
      - title: Bray-Curtis
        name: bray
      - title: Jaccard
        name: jaccard
      - title: Euclidean
        name: euclidean
      - title: Manhattan
        name: manhattan
      - title: Canberra
        name: canberra
      - title: Kulczynski
        name: kulczynski
      - title: Gower
        name: gower
      - title: Morisita
        name: morisita
      - title: Horn-Morisita
        name: horn
      - title: Mountford
        name: mountford
      - title: Raup-Crick
        name: raup
      - title: Binomial
        name: binomial
      - title: Chao
        name: chao
      - title: Cao
        name: cao
      - title: Clark
        name: clark
      - title: Alternative Gower
        name: altGower
      - title: Mahalanobis
        name: mahalanobis
    default: bray

  - name: distBinary
    title: Binary (presence/absence)
    type: Bool
    default: false

  - name: seed
    title: Random seed
    type: Number
    default: 0
    min: 0

  - name: simperN
    title: Permutations
    type: Number
    default: 999
    min: 1

  - name: simperTop
    title: Top N features
    type: Number
