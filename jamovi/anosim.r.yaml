---
name: anosim
title: ANOSIM
jrs: '1.1'

items:
  - name: guidance
    title: Getting started
    type: Html
    visible: false

  - name: summary
    title: Data Summary
    type: Table
    visible: false
    rows: 0
    columns:
      - name: item
        title: Item
        type: text
      - name: value
        title: Value
        type: text

  - name: warnings
    title: Data handling warnings
    type: Html
    visible: false

  - name: global
    title: Global ANOSIM
    type: Table
    visible: false
    rows: 0
    columns:
      - name: statistic
        title: Statistic
        type: text
      - name: value
        title: R
        type: number
      - name: p
        title: Permutation p
        type: number
        format: zto,pvalue
      - name: permutations
        title: Effective permutations
        type: integer

  - name: pairwise
    title: Pairwise ANOSIM
    type: Table
    visible: false
    rows: 0
    columns:
      - name: contrast
        title: Contrast
        type: text
      - name: r
        title: R
        type: number
      - name: p
        title: Permutation p
        type: number
        format: zto,pvalue

      - name: padj
        title: Adjusted p
        type: number
        format: zto,pvalue

  - name: rankPlot
    title: Ranked dissimilarities by pair category
    type: Image
    visible: false
    width: 600
    height: 480
    renderFun: .plotRank

  - name: rankPlotDescription
    title: Plot details
    type: Html
    visible: false

  - name: rankSummary
    title: Ranked-dissimilarity summary
    type: Table
    visible: false
    rows: 0
    columns:
      - name: category
        title: Pair category
        type: text
      - name: pairs
        title: Pairs
        type: integer
      - name: median
        title: Median rank
        type: number
      - name: q1
        title: Q1 rank
        type: number
      - name: q3
        title: Q3 rank
        type: number

  - name: note
    title: Interpretation
    type: Html
    visible: false

  - name: settings
    title: Analysis settings
    type: Table
    visible: false
    rows: 0
    columns:
      - name: setting
        title: Setting
        type: text
      - name: value
        title: Value
        type: text

