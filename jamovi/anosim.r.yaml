---
name: anosim
title: ANOSIM
jrs: '1.1'

items:
  - name: guidance
    title: Getting started
    type: Html
    visible: false

  - name: summaryPurpose
    title: Data Summary
    type: Html
    visible: false

  - name: summary
    title: ''
    type: Table
    visible: false
    rows: 6
    columns:
      - name: item
        title: Item
        type: text
      - name: value
        title: Value
        type: text

  - name: warnings
    title: ''
    type: Html
    visible: false

  - name: globalPurpose
    title: Global ANOSIM
    type: Html
    visible: false

  - name: global
    title: ''
    type: Table
    visible: false
    rows: 1
    columns:
      - name: statistic
        title: Statistic
        type: text
      - name: value
        title: R
        type: number
      - name: p
        title: Permutation p
        type: number
        format: zto,pvalue
      - name: permutations
        title: Effective permutations
        type: integer

  - name: pairwisePurpose
    title: Pairwise ANOSIM
    type: Html
    visible: false

  - name: pairwise
    title: ''
    type: Table
    visible: false
    rows: 0
    columns:
      - name: contrast
        title: Contrast
        type: text
      - name: r
        title: R
        type: number
      - name: p
        title: Permutation p
        type: number
        format: zto,pvalue

      - name: padj
        title: Adjusted p
        type: number
        format: zto,pvalue

  - name: rankPlotDescription
    title: Ranked dissimilarities by pair category
    type: Html
    visible: false
    clearWith:
      - vars
      - factor
      - transform
      - distance
      - strata
      - permRestriction
      - permScheme
      - anosimN
      - seed
      - showRankPlot

  - name: rankPlot
    title: ''
    type: Image
    visible: false
    clearWith:
      - vars
      - factor
      - transform
      - distance
      - strata
      - permRestriction
      - permScheme
      - anosimN
      - seed
      - showRankPlot
    width: 600
    height: 480
    renderFun: .plotRank

  - name: rankSummaryPurpose
    title: Ranked-dissimilarity summary
    type: Html
    visible: false

  - name: rankSummary
    title: ''
    type: Table
    visible: false
    rows: 0
    columns:
      - name: category
        title: Pair category
        type: text
      - name: pairs
        title: Pairs
        type: integer
      - name: median
        title: Median rank
        type: number
      - name: q1
        title: Q1 rank
        type: number
      - name: q3
        title: Q3 rank
        type: number

  - name: note
    title: How to read these results
    type: Html
    visible: false

  - name: settingsPurpose
    title: Analysis settings
    type: Html
    visible: false

  - name: settings
    title: ''
    type: Table
    visible: false
    rows: 0
    columns:
      - name: setting
        title: Setting
        type: text
      - name: value
        title: Value
        type: text

...
