      - title: Presence/absence
        name: pa
      - title: Wisconsin
        name: wisconsin
      - title: Hellinger
        name: hellinger
      - title: Total
        name: total
      - title: Max
        name: max
      - title: Frequency
        name: frequency
      - title: Normalize
        name: normalize
      - title: Range
        name: range
      - title: Standardize
        name: standardize
      - title: Chi-square
        name: chi.square
