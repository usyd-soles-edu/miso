---
name: permdisp
title: PERMDISP
jrs: '1.1'
refs:
  - vegan
  - anderson2006

items:
  - name: guidance
    title: Getting Started
    type: Html
    visible: false

  - name: warnings
    title: ''
    type: Html
    visible: false

  - name: anova
    title: Dispersion Test
    type: Table
    visible: false
    rows: 0
    columns:
      - name: source
        title: Source
        type: text
      - name: df
        title: df
        type: integer
      - name: sumsqs
        title: Sum Sq
        type: number
      - name: meansq
        title: Mean Sq
        type: number
      - name: f
        title: F
        type: number
      - name: p
        title: Permutation p
        type: number
        format: zto,pvalue

  - name: pairwise
    title: Pairwise Dispersion Comparisons
    type: Table
    visible: false
    rows: 0
    columns:
      - name: contrast
        title: Contrast
        type: text
      - name: statistic
        title: t
        type: number
      - name: p
        title: Permutation p
        type: number
        format: zto,pvalue
      - name: padj
        title: Adjusted p
        type: number
        format: zto,pvalue

  - name: plotDescription
    title: Distance to Group Centre
    type: Html
    visible: false
    clearWith:

  - name: plot
    title: Distance to Group Centre Plot
    type: Image
    visible: false
    clearWith:
    width: 600
    height: 460
    renderFun: .plotDistances

  - name: distances
    title: Distances to Group Centre
    type: Table
    visible: false
    rows: 0
    columns:
      - name: group
        title: Group
        type: text
      - name: 'n'
        title: n
        type: integer
      - name: centre
        title: Group centre
        type: text
      - name: distance
        title: Mean distance
        type: number
      - name: median
        title: Median distance
        type: number
      - name: q1
        title: Q1 distance
        type: number
      - name: q3
        title: Q3 distance
        type: number
      - name: sd
        title: Standard deviation
        type: number
      - name: min
        title: Minimum
        type: number
      - name: max
        title: Maximum
        type: number

  - name: ordinationDescription
    title: Ordination with Group Centres
    type: Html
    visible: false
    clearWith:

  - name: ordinationPlot
    title: Ordination with Group Centres
    type: Image
    visible: false
    clearWith:
    width: 600
    height: 500
    renderFun: .plotOrdination

  - name: ordinationScores
    title: Ordination Coordinates
    type: Table
    visible: false
    clearWith:
    rows: 0
    columns:
      - name: point
        title: Point
        type: text
      - name: pointType
        title: Type
        type: text
      - name: group
        title: Group
        type: text
      - name: plotKey
        title: Plot key
        type: text
      - name: axis1
        title: Axis 1
        type: number
      - name: axis2
        title: Axis 2
        type: number
