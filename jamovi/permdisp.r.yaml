---
name: permdisp
title: PERMDISP
jrs: '1.1'

items:
  - name: guidance
    title: Getting started
    type: Html
    visible: false

  - name: summary
    title: Data Summary
    type: Table
    visible: false
    rows: 0
    columns:
      - name: item
        title: Item
        type: text
      - name: value
        title: Value
        type: text

  - name: warnings
    title: Data handling warnings
    type: Html
    visible: false

  - name: anova
    title: Dispersion Test
    type: Table
    visible: false
    rows: 0
    columns:
      - name: source
        title: Source
        type: text
      - name: df
        title: df
        type: integer
      - name: sumsqs
        title: Sum Sq
        type: number
      - name: meansq
        title: Mean Sq
        type: number
      - name: f
        title: F
        type: number
      - name: p
        title: Permutation p
        type: number
        format: zto,pvalue

  - name: pairwise
    title: Pairwise Dispersion Comparisons
    type: Table
    visible: false
    rows: 0
    columns:
      - name: contrast
        title: Contrast
        type: text
      - name: statistic
        title: t
        type: number
      - name: p
        title: Permutation p
        type: number
        format: zto,pvalue
      - name: padj
        title: Adjusted p
        type: number
        format: zto,pvalue

  - name: plot
    title: Distance to group centre
    type: Image
    visible: false
    width: 600
    height: 460
    renderFun: .plotDistances

  - name: plotDescription
    title: Plot details
    type: Html
    visible: false

  - name: distances
    title: Distance-to-centre summary
    type: Table
    visible: false
    rows: 0
    columns:
      - name: group
        title: Group
        type: text
      - name: 'n'
        title: n
        type: integer
      - name: centre
        title: Group centre
        type: text
      - name: distance
        title: Mean distance
        type: number
      - name: median
        title: Median distance
        type: number
      - name: q1
        title: Q1 distance
        type: number
      - name: q3
        title: Q3 distance
        type: number
      - name: sd
        title: Standard deviation
        type: number
      - name: min
        title: Minimum
        type: number
      - name: max
        title: Maximum
        type: number

  - name: ordinationPlot
    title: Ordination with group centres
    type: Image
    visible: false
    width: 600
    height: 500
    renderFun: .plotOrdination

  - name: ordinationDescription
    title: Ordination details
    type: Html
    visible: false

  - name: ordinationScores
    title: Ordination coordinates
    type: Table
    visible: false
    rows: 0
    columns:
      - name: point
        title: Point
        type: text
      - name: pointType
        title: Type
        type: text
      - name: group
        title: Group
        type: text
      - name: plotKey
        title: Plot key
        type: text
      - name: axis1
        title: Axis 1
        type: number
      - name: axis2
        title: Axis 2
        type: number

  - name: note
    title: Interpretation
    type: Html
    visible: false

  - name: settings
    title: Analysis settings
    type: Table
    visible: false
    rows: 0
    columns:
      - name: setting
        title: Setting
        type: text
      - name: value
        title: Value
        type: text

...
