title: PERMDISP
name: permdisp
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Feature variables (required)
        children:
          - type: VariablesListBox
            name: vars
            isTarget: true
      - type: TargetLayoutBox
        label: Grouping variable (required)
        children:
          - type: VariablesListBox
            name: factor
            maxItemCount: 1
            isTarget: true
  - type: CollapseBox
    name: analysisChoices
    label: Analysis choices
    collapsed: false
    stretchFactor: 1
    children:
      - type: ComboBox
        name: transform
      - type: ComboBox
        name: distance
      - type: ComboBox
        name: dispType
      - type: CheckBox
        name: dispPairwise
        events:
          change: update_control_states
      - type: ComboBox
        name: dispAdjust
  - type: CollapseBox
    name: advancedOptions
    label: Advanced options
    collapsed: true
    stretchFactor: 1
    children:
      - type: CheckBox
        name: distBinary
      - type: CheckBox
        name: distSqrt
      - type: ComboBox
        name: distAdd
      - type: CheckBox
        name: dispBias
  - type: CollapseBox
    name: reproducibility
    label: Reproducibility and computation
    collapsed: true
    stretchFactor: 1
    children:
      - type: TextBox
        name: permN
        format: number
      - type: ComboBox
        name: permRestriction
      - type: TextBox
        name: seed
        format: number
      - type: CheckBox
        name: useParallel
