title: PERMDISP
name: permdisp
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Feature Variables
        children:
          - type: VariablesListBox
            name: vars
            isTarget: true
      - type: TargetLayoutBox
        label: Grouping Variable
        children:
          - type: VariablesListBox
            name: factor
            maxItemCount: 1
            isTarget: true
  - type: CollapseBox
    name: analysisChoices
    label: Analysis Choices
    collapsed: false
    stretchFactor: 1
    children:
      - type: ComboBox
        name: transform
      - type: ComboBox
        name: distance
      - type: ComboBox
        name: dispType
      - type: CheckBox
        name: dispPairwise
        style: list
        events:
          change: update_control_states
        children:
          - type: ComboBox
            name: dispAdjust
            enable: (dispPairwise)
  - type: CollapseBox
    name: plots
    label: Plots
    collapsed: false
    stretchFactor: 1
    children:
      - type: CheckBox
        name: showDistancePlot
      - type: CheckBox
        name: showOrdinationPlot
  - type: CollapseBox
    name: advancedOptions
    label: Advanced Options
    collapsed: true
    stretchFactor: 1
    children:
      - type: CheckBox
        name: distBinary
      - type: CheckBox
        name: distSqrt
      - type: ComboBox
        name: distAdd
      - type: CheckBox
        name: dispBias
  - type: CollapseBox
    name: reproducibility
    label: Reproducibility and Computation
    collapsed: true
    stretchFactor: 1
    children:
      - type: TextBox
        name: permN
        format: number
      - type: ComboBox
        name: permRestriction
      - type: TextBox
        name: seed
        format: number
      - type: CheckBox
        name: useParallel
