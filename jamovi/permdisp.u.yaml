title: PERMDISP
name: permdisp
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Feature variables
        children:
          - type: VariablesListBox
            name: vars
            isTarget: true
      - type: TargetLayoutBox
        label: Grouping variable
        children:
          - type: VariablesListBox
            name: factor
            maxItemCount: 1
            isTarget: true
  - type: CollapseBox
    label: Resemblance
    collapsed: false
    stretchFactor: 1
    children:
      - type: ComboBox
        name: transform
      - type: ComboBox
        name: distance
      - type: CheckBox
        name: distBinary
      - type: CheckBox
        name: distSqrt
      - type: ComboBox
        name: distAdd
      - type: TextBox
        name: seed
        format: number
  - type: CollapseBox
    label: PERMDISP
    collapsed: false
    stretchFactor: 1
    children:
      - type: TextBox
        name: permN
        format: number
      - type: ComboBox
        name: permScheme
      - type: ComboBox
        name: dispType
      - type: CheckBox
        name: dispBias
      - type: CheckBox
        name: dispPairwise
      - type: ComboBox
        name: dispAdjust
